services:
    zabbix-proxy:
        image: zabbix/zabbix-proxy-sqlite3:6.0.38-alpine
        container_name: ${HOSTNAME}
        hostname: ${HOSTNAME}
        env_file: 
          - ./envs/zabbix-proxy/common_proxy.env
        volumes:
            - /opt/observit/scripts/externalscripts:/usr/lib/zabbix/externalscripts
            - /opt/observit/tls.psk:/var/lib/zabbix/enc/tls.psk
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
            - /etc/hosts:/etc/hosts
        restart: always
        network_mode: host

    zabbix-agent:
        container_name: zabbix-agent
        hostname: ${HOSTNAME}
        image: zabbix/zabbix-agent2:6.0.38-alpine
        user: root
        network_mode: host
        restart: always
        privileged: true
        volumes:
          - /var/run:/var/run
        env_file: 
            - ./envs/zabbix-proxy/common_agent.env
